name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Check gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt'd:"
            echo "$files"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          changes=$(git status --porcelain go.mod go.sum)
          if [ -n "$changes" ]; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result:"
            echo "$changes"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -shuffle=on

      - name: Compile integration tests (no credentials in CI, so they skip)
        run: go test -tags=integration ./client/... -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.x"

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --build-tags=integration
