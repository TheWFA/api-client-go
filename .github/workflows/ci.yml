name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Check gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt'd:"
            echo "$files"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          changes=$(git status --porcelain go.mod go.sum)
          if [ -n "$changes" ]; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result:"
            echo "$changes"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -shuffle=on

      - name: Compile integration tests (no credentials in CI, so they skip)
        run: go test -tags=integration ./client/... -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.x"

      - uses: golangci/golangci-lint-action@v7
        with:
          # v6 of this action only supports golangci-lint v1, which has a
          # typecheck bug on a module whose root directory is itself an
          # importable package ("undefined: wfa" in every subpackage). v7
          # supports v2, which is verified clean on this codebase.
          version: v2.13.1
          args: --build-tags=integration

  integration:
    name: Integration tests (live API)
    runs-on: ubuntu-latest
    # Only on pushes to main, never on pull_request — PRs from forks don't
    # get environment secrets, and this hits the real API on every run.
    if: github.event_name == 'push'
    environment: Default
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.x"

      - name: Test
        env:
          WFA_API_KEY: ${{ secrets.WFA_API_KEY }}
          WFA_API_BASE_URL: ${{ secrets.WFA_API_BASE_URL }}
        run: go test -tags=integration ./client/... -v
